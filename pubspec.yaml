name: smart_car_rent
description: A comprehensive car rental app for Tanzania
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  go_router: ^17.0.0
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  bloc: ^9.2.1
  
  # Network & API
  http: ^1.1.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  
  # Images & Media
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  file_picker: ^11.0.2
  
  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  url_launcher: ^6.1.10
  
  # Audio
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/audio/
